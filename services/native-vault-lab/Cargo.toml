[package]
name = "replay-native-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
[workspace]
[dependencies]
serde_json = "=1.0.151"
tactus-o1-devnet-driver = { path = "../../crates/tactus-o1-devnet-driver" }
tactus-o1-native-vault-script = { path = "../../proofs/ckb-native-vault" }
tactus-o1-native-anchor-script = { path = "../../proofs/ckb-native-anchor", default-features = false }
tactus-o1-protocol = { path = "../../crates/tactus-o1-protocol", features = ["native-bridge"] }
tactus-o1-execution = { path = "../../crates/tactus-o1-execution", features = ["native-bridge"] }
alloy-primitives = "=1.6.0"
alloy-consensus = "=2.1.1"
alloy-eips = "=2.1.1"
k256 = { version = "0.13", features = ["ecdsa"] }

tactus-o1-native-settlement-script = { path = "../../proofs/ckb-native-settlement", default-features = false }
tactus-o1-native-proof-journal = { path = "../../proofs/native-sp1/journal" }
[patch.crates-io]
lazy_static = { path = "../../proofs/vendor/lazy_static-1.5.1" }
