[package]
name = "tactus-v02-lab"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
[workspace]
[dependencies]
serde_json = "=1.0.151"
sha2 = "=0.10.9"
secp256k1 = { version = "0.29", features = ["recovery"] }
ckb-std = { version = "=0.15.3", default-features = false, features = ["ckb-types"] }
tactus-o1-devnet-driver = { path = "../../crates/tactus-o1-devnet-driver" }
tactus-o1-protocol = { path = "../../crates/tactus-o1-protocol", features = ["v02"] }
tactus-o1-execution = { path = "../../crates/tactus-o1-execution", features = ["v02"] }
tactus-v02-script = { path = "../../proofs/ckb-v02", default-features = false }
tactus-v02-proof-journal = { path = "../../proofs/v02-sp1/journal" }
alloy-primitives = "=1.6.0"
alloy-consensus = "=2.1.1"
alloy-eips = "=2.1.1"
k256 = { version = "=0.13.4", features = ["ecdsa"] }
alloy-trie = { version = "=0.9.8", features = ["ethereum"] }
alloy-rlp = "=0.3.16"
tactus-o1-state-proof-script = { path = "../../proofs/ckb-state-proof", default-features = false }
[patch.crates-io]
lazy_static = { path = "../../proofs/vendor/lazy_static-1.5.1" }
sp1-verifier = { path = "../../proofs/vendor/sp1-verifier-6.8.1" }
substrate-bn-succinct-rs = { path = "../../proofs/vendor/substrate-bn-succinct-rs-0.6.0" }
