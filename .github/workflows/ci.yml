name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked -p tactus-o1-execution --features native-bridge --all-targets -- -D warnings
      - run: cargo test --locked -p tactus-o1-execution --features native-bridge --test native_bridge
      - run: cargo test --locked --workspace --quiet
      - name: Audit retained seal contention and corrupted evidence
        run: python3 scripts/test-seal-analysis.py
      - name: Audit admission fee evidence and falsified controls
        run: |
          (cd specs/evidence/admission-fees && sha256sum --check SHA256SUMS)
          python3 -B scripts/test-admission-fees.py
      - name: Independent batch codec vectors
        run: |
          python3 scripts/generate-batch-vectors.py
          git diff --exit-code -- specs/test-vectors/batch-v1
      - name: Harness smoke (regression on the A1 fee-effect)
        run: cargo run --locked --quiet --bin tactus-o1-experiment-a >/dev/null

  native-proof-statement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proofs/native-sp1
      - run: cargo fmt --manifest-path proofs/native-sp1/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path proofs/native-sp1/Cargo.toml -p tactus-o1-native-proof-journal --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path proofs/native-sp1/Cargo.toml -p tactus-o1-native-proof-journal
      - name: Audit retained native guest output and falsified controls
        run: |
          (cd specs/evidence/native-guest && sha256sum --check SHA256SUMS)
          python3 -B scripts/test-native-guest.py

  native-proof-tools:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      GOMAXPROCS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proofs/native-prover
      - run: cargo fmt --manifest-path proofs/native-prover/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path proofs/native-prover/Cargo.toml --all-targets --features native-gnark -- -D warnings
      - run: python3 -B scripts/test-chain-proof-staging.py

  native-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
          targets: riscv64imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            proofs/ckb-native-vault
            proofs/ckb-native-anchor
            proofs/ckb-native-checkpoint
            proofs/ckb-native-settlement
            services/native-vault-lab
      - run: bash scripts/build-native-anchor-script.sh
      - run: cargo fmt --manifest-path proofs/ckb-native-anchor/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path proofs/ckb-native-anchor/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path proofs/ckb-native-anchor/Cargo.toml --target riscv64imac-unknown-none-elf --lib -- -D warnings
      - run: cargo test --locked --manifest-path proofs/ckb-native-anchor/Cargo.toml
      - run: cargo fmt --manifest-path proofs/ckb-native-checkpoint/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path proofs/ckb-native-checkpoint/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path proofs/ckb-native-checkpoint/Cargo.toml --target riscv64imac-unknown-none-elf --lib -- -D warnings
      - run: cargo test --locked --manifest-path proofs/ckb-native-checkpoint/Cargo.toml
      - run: bash scripts/build-native-checkpoint-script.sh
      - run: cargo fmt --manifest-path proofs/ckb-native-settlement/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path proofs/ckb-native-settlement/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path proofs/ckb-native-settlement/Cargo.toml
      - run: bash scripts/build-native-settlement-script.sh
      - run: cargo clippy --locked --manifest-path proofs/ckb-native-settlement/Cargo.toml --target riscv64imac-unknown-none-elf --lib -- -D warnings
        env:
          RUSTFLAGS: --cfg tactus_ckb_single_thread --check-cfg=cfg(tactus_ckb_single_thread)
      - run: cargo fmt --manifest-path proofs/ckb-native-vault/Cargo.toml -- --check
      - run: cargo fmt --manifest-path services/native-vault-lab/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path proofs/ckb-native-vault/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path services/native-vault-lab/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path proofs/ckb-native-vault/Cargo.toml
      - run: cargo test --locked --manifest-path services/native-vault-lab/Cargo.toml
      - run: bash scripts/build-native-vault-script.sh
      - name: Audit funded deposits and real state-proof regression
        run: |
          (cd specs/evidence/native-vault && sha256sum --check SHA256SUMS)
          python3 -B scripts/test-native-vault.py
          (cd specs/evidence/native-vault-recovery && sha256sum --check SHA256SUMS)
          python3 -B scripts/test-native-vault-recovery.py
          (cd specs/evidence/native-publication && sha256sum --check SHA256SUMS)
          python3 -B scripts/test-native-publication.py
          (cd specs/evidence/native-checkpoint && sha256sum --check SHA256SUMS)
          python3 -B scripts/test-native-checkpoint.py
          (cd specs/evidence/native-settlement && sha256sum --check SHA256SUMS)
          python3 -B scripts/test-native-settlement.py
          python3 -B scripts/check-settled-state-proof.py specs/evidence/native-vault/state-proof-regression/evidence.json.gz

  settled-state-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
          targets: riscv64imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proofs/ckb-state-proof
      - run: cargo fmt --manifest-path proofs/ckb-state-proof/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path proofs/ckb-state-proof/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path proofs/ckb-state-proof/Cargo.toml
      - run: bash scripts/build-state-proof-script.sh
      - name: Audit actual state-read receipts and forged controls
        run: |
          (cd specs/evidence/settled-state-proof && sha256sum --check SHA256SUMS)
          python3 -B scripts/test-settled-state-proof.py

  observer-rpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/observer-rpc
      - run: cargo fmt --manifest-path services/observer-rpc/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path services/observer-rpc/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path services/observer-rpc/Cargo.toml
        env:
          TACTUS_OBSERVER_PROOF_EXPORT: ${{ runner.temp }}/observer-state-proofs.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: services/proof-checker/go.sum
      - name: Independently verify regenerated state witnesses with Geth
        working-directory: services/proof-checker
        run: |
          go test ./...
          go run . "$RUNNER_TEMP/observer-state-proofs.json"
      - name: Audit HTTP evidence and execution dependency pins
        run: |
          (cd specs/evidence/observer-rpc && sha256sum --check SHA256SUMS)
          python3 -B scripts/test-observer-rpc.py
          (cd specs/evidence/observer-reorg && sha256sum --check SHA256SUMS)
          python3 -B scripts/test-observer-reorg.py
          (cd specs/evidence/observer-logs && sha256sum --check SHA256SUMS)
          python3 -B scripts/test-observer-logs.py
          (cd specs/evidence/observer-state-proofs && sha256sum --check SHA256SUMS)
          python3 -B scripts/test-observer-state-proofs.py

  evm-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Build independent pinned Go Ethereum transition tool
        run: |
          mkdir -p "$RUNNER_TEMP/evm-tools"
          GOBIN="$RUNNER_TEMP/evm-tools" go install github.com/ethereum/go-ethereum/cmd/evm@v1.17.8
      - name: Rebuild pinned bridge contract and verify direct-call semantics
        run: |
          python3 scripts/build-bridge-contract.py
          git diff --exit-code -- contracts/bridge/NativeCKB.json
          (cd services/bridge-checker && TACTUS_BRIDGE_GETH_EXPORT="$RUNNER_TEMP/bridge-system-calls.json" go test -count=1 ./...)
          cmp "$RUNNER_TEMP/bridge-system-calls.json" specs/evidence/native-ckb-contract/system-calls-geth.json
          (cd specs/evidence/native-ckb-contract && sha256sum --check SHA256SUMS)
          python3 -B scripts/check-native-ckb-contract.py
          python3 -B scripts/test-native-ckb-contract.py
      - name: Compare Ethereum roots, gas and rejection indices
        run: |
          cargo run --locked --quiet -p tactus-o1-execution --example execution-vectors -- artifacts/evm-differential
          python3 scripts/check-execution-geth.py "$RUNNER_TEMP/evm-tools/evm" artifacts/evm-differential specs/test-vectors/execution-v1/geth-1.17.8.json
          cargo run --locked --quiet -p tactus-o1-execution --example settlement-continuation -- specs/evidence/chain-proof-recovery/0.210.0/proving-input.json artifacts/settlement-continuation
          python3 scripts/check-execution-geth.py "$RUNNER_TEMP/evm-tools/evm" artifacts/settlement-continuation
          cmp artifacts/settlement-continuation/continuation.json specs/test-vectors/proof-v1/settlement-continuation.json
          cargo run --locked --quiet -p tactus-o1-execution --example sealed-settlement-oracle -- specs/evidence/sealed-settlement-input/0.210.0/proving-input.json artifacts/sealed-settlement-geth
          python3 scripts/check-execution-geth.py "$RUNNER_TEMP/evm-tools/evm" artifacts/sealed-settlement-geth specs/evidence/sealed-settlement-input/0.210.0/geth/verified.json
      - name: Compare signed bridge calls with independent Geth
        run: |
          cargo run --locked --quiet -p tactus-o1-execution --example native-ckb-vectors -- artifacts/native-ckb-contract
          gzip -dc specs/evidence/native-ckb-contract/verified.json.gz > "$RUNNER_TEMP/native-ckb-verified.json"
          python3 -B scripts/check-execution-geth.py "$RUNNER_TEMP/evm-tools/evm" artifacts/native-ckb-contract "$RUNNER_TEMP/native-ckb-verified.json"
      - name: Reproduce candidate native custody execution
        run: |
          mkdir -p artifacts/native-bridge-execution
          cargo run --locked --quiet -p tactus-o1-execution --features native-bridge --example native-bridge-vectors -- artifacts/native-bridge-execution/candidate.json
          cmp artifacts/native-bridge-execution/candidate.json specs/evidence/native-bridge-execution/candidate.json
          (cd services/bridge-checker && TACTUS_NATIVE_BRIDGE_VECTOR="$GITHUB_WORKSPACE/artifacts/native-bridge-execution/candidate.json" TACTUS_NATIVE_BRIDGE_GETH_EXPORT="$GITHUB_WORKSPACE/artifacts/native-bridge-execution/geth.json" go test -mod=readonly -count=1 -run TestCandidateNativeExecutionAgainstGeth .)
          cmp artifacts/native-bridge-execution/geth.json specs/evidence/native-bridge-execution/geth.json
          (cd specs/evidence/native-bridge-execution && sha256sum --check SHA256SUMS)
          python3 -B scripts/check-native-bridge-execution.py artifacts/native-bridge-execution
          python3 -B scripts/test-native-bridge-execution.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evm-differential
          path: |
            artifacts/evm-differential/
            artifacts/native-ckb-contract/
            artifacts/native-bridge-execution/
            artifacts/settlement-continuation/
            artifacts/sealed-settlement-geth/

  ckb-mechanisms:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - ckb: '0.210.0'
            sha256: 'f7ea14476229883153eaef2f96aa3ae9e67c6f7254fe642aa06014cc6333d017'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: riscv64imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Install pinned reference CKB
        shell: bash
        env:
          CKB_VERSION: ${{ matrix.ckb }}
          CKB_SHA256: ${{ matrix.sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/ckb"
          curl --fail --location --retry 3 "https://github.com/nervosnetwork/ckb/releases/download/v$CKB_VERSION/ckb_v${CKB_VERSION}_x86_64-unknown-linux-gnu-portable.tar.gz" -o "$RUNNER_TEMP/ckb.tar.gz"
          printf '%s  %s/ckb.tar.gz\n' "$CKB_SHA256" "$RUNNER_TEMP" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/ckb.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/ckb"
      - name: Run isolated A1/A2/A3 mechanisms and VM rejection tests
        env:
          TACTUS_CKB_VERSION: ${{ matrix.ckb }}
        run: CKB_BIN="$RUNNER_TEMP/ckb/ckb" scripts/run-devnet-experiments.sh
      - name: Verify inline batch data, limits and reorg recovery
        env:
          TACTUS_CKB_VERSION: ${{ matrix.ckb }}
          TACTUS_DEVNET_SUITE: replay-batch
        run: CKB_BIN="$RUNNER_TEMP/ckb/ckb" scripts/run-devnet-experiments.sh
      - name: Compare authenticated A1/A2/A3 admission under matched races
        env:
          TACTUS_CKB_VERSION: ${{ matrix.ckb }}
          TACTUS_DEVNET_SUITE: replay-admission
        run: CKB_BIN="$RUNNER_TEMP/ckb/ckb" scripts/run-devnet-experiments.sh
      - name: Compare admission under matched serialized-byte fees
        env:
          TACTUS_CKB_VERSION: ${{ matrix.ckb }}
          TACTUS_DEVNET_SUITE: replay-admission
          TACTUS_ADMISSION_FEES: wire-density
        run: CKB_BIN="$RUNNER_TEMP/ckb/ckb" scripts/run-devnet-experiments.sh
      - name: Measure sustained L1 L2 L3 load, saturation and mandatory drain
        env:
          TACTUS_CKB_VERSION: ${{ matrix.ckb }}
          TACTUS_DEVNET_SUITE: replay-load
        run: CKB_BIN="$RUNNER_TEMP/ckb/ckb" scripts/run-devnet-experiments.sh
      - name: Recover A3 and EVM state after a two-node network reorg
        env:
          TACTUS_CKB_VERSION: ${{ matrix.ckb }}
          TACTUS_DEVNET_SUITE: replay-network
        run: CKB_BIN="$RUNNER_TEMP/ckb/ckb" scripts/run-devnet-experiments.sh
      - name: Verify mandatory A3 sealed snapshots and hostile switching
        env:
          TACTUS_CKB_VERSION: ${{ matrix.ckb }}
          TACTUS_DEVNET_SUITE: replay-sealed
        run: CKB_BIN="$RUNNER_TEMP/ckb/ckb" scripts/run-devnet-experiments.sh
      - name: Qualify funded native CKB deposits and custody boundaries
        env:
          TACTUS_CKB_VERSION: ${{ matrix.ckb }}
          TACTUS_DEVNET_SUITE: replay-native-vault
        run: CKB_BIN="$RUNNER_TEMP/ckb/ckb" scripts/run-devnet-experiments.sh
      - name: Immutable native custody checkpoints on CKB 0.210.0
        env:
          TACTUS_CKB_VERSION: ${{ matrix.ckb }}
          TACTUS_DEVNET_SUITE: replay-native-checkpoint
        run: CKB_BIN="$RUNNER_TEMP/ckb/ckb" scripts/run-devnet-experiments.sh
      - name: Authenticate native custody publications and replay their signed burns
        env:
          TACTUS_CKB_VERSION: ${{ matrix.ckb }}
          TACTUS_DEVNET_SUITE: replay-native-publication
        run: |
          CKB_BIN="$RUNNER_TEMP/ckb/ckb" scripts/run-devnet-experiments.sh
          for publication_evidence in artifacts/native-publication-*/evidence.json artifacts/native-checkpoint-*/evidence.json; do
            publication_run="${publication_evidence%/evidence.json}"
            (cd services/bridge-checker && TACTUS_NATIVE_PUBLICATION_VECTOR="$GITHUB_WORKSPACE/$publication_run/execution.json" TACTUS_NATIVE_PUBLICATION_GETH_EXPORT="$GITHUB_WORKSPACE/$publication_run/geth.json" go test -count=1 -mod=readonly -run TestPublishedNativeExecutionAgainstGeth .)
            python3 -B scripts/check-native-publication.py "$publication_run" > "$publication_run/check.json"
          done
      - name: Bind actual native settlement and reject unproved transitions
        env:
          TACTUS_CKB_VERSION: ${{ matrix.ckb }}
          TACTUS_DEVNET_SUITE: replay-native-settlement
        run: |
          CKB_BIN="$RUNNER_TEMP/ckb/ckb" scripts/run-devnet-experiments.sh
          for native_evidence in artifacts/native-settlement-*/evidence.json; do
            native_run="${native_evidence%/evidence.json}"
            (cd services/bridge-checker && TACTUS_NATIVE_PUBLICATION_VECTOR="$GITHUB_WORKSPACE/$native_run/execution.json" TACTUS_NATIVE_PUBLICATION_GETH_EXPORT="$GITHUB_WORKSPACE/$native_run/geth.json" go test -count=1 -mod=readonly -run TestPublishedNativeExecutionAgainstGeth .)
            python3 -B scripts/check-native-settlement.py "$native_run" --without-guest-execution > "$native_run/check.json"
          done
      - name: Verify bounded churn against freshly rebuilt seals
        env:
          TACTUS_CKB_VERSION: ${{ matrix.ckb }}
          TACTUS_DEVNET_SUITE: replay-seal-contention
        run: CKB_BIN="$RUNNER_TEMP/ckb/ckb" scripts/run-devnet-experiments.sh
      - name: Verify A2 obligations and challenge-only forced-inclusion counterexample
        env:
          TACTUS_CKB_VERSION: ${{ matrix.ckb }}
          TACTUS_DEVNET_SUITE: replay-priority
        run: CKB_BIN="$RUNNER_TEMP/ckb/ckb" scripts/run-devnet-experiments.sh
      - name: Reconstruct EVM state across canonical CKB branch replacement
        env:
          TACTUS_CKB_VERSION: ${{ matrix.ckb }}
          TACTUS_DEVNET_SUITE: replay-evm
        run: CKB_BIN="$RUNNER_TEMP/ckb/ckb" scripts/run-devnet-experiments.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ckb-experiment-evidence-${{ matrix.ckb }}
          path: |
            artifacts/load-*/evidence.json
            artifacts/native-vault-*/evidence.json
            artifacts/native-vault-*/manifest.json
            artifacts/native-vault-*/replay.log
            artifacts/native-vault-*/vault-check.json
            artifacts/native-vault-*/canonical-blocks.json
            artifacts/native-vault-*/recovery-check.json
            artifacts/native-publication-*/evidence.json
            artifacts/native-publication-*/manifest.json
            artifacts/native-publication-*/replay.log
            artifacts/native-publication-*/execution.json
            artifacts/native-publication-*/geth.json
            artifacts/native-publication-*/check.json
            artifacts/native-checkpoint-*/evidence.json
            artifacts/native-checkpoint-*/summary.json
            artifacts/native-checkpoint-*/manifest.json
            artifacts/native-checkpoint-*/replay.log
            artifacts/native-checkpoint-*/node.log
            artifacts/native-checkpoint-*/node/ckb.toml
            artifacts/native-checkpoint-*/node/specs/dev.toml
            artifacts/native-checkpoint-*/execution.json
            artifacts/native-checkpoint-*/geth.json
            artifacts/native-checkpoint-*/check.json
            artifacts/native-settlement-*/evidence.json
            artifacts/native-settlement-*/summary.json
            artifacts/native-settlement-*/manifest.json
            artifacts/native-settlement-*/replay.log
            artifacts/native-settlement-*/node.log
            artifacts/native-settlement-*/node/ckb.toml
            artifacts/native-settlement-*/node/specs/dev.toml
            artifacts/native-settlement-*/execution.json
            artifacts/native-settlement-*/geth.json
            artifacts/native-settlement-*/check.json
            artifacts/native-settlement-*/proving-input-*.json
            artifacts/load-*/summary.json
            artifacts/load-*/manifest.json
            artifacts/load-*/replay.log
            artifacts/load-*/node.log
            artifacts/load-*/node/ckb.toml
            artifacts/load-*/node/specs/dev.toml
            artifacts/seal-contention-*/evidence.json
            artifacts/seal-contention-*/summary.json
            artifacts/seal-contention-*/manifest.json
            artifacts/seal-contention-*/replay.log
            artifacts/seal-contention-*/node.log
            artifacts/seal-contention-*/node/ckb.toml
            artifacts/seal-contention-*/node/specs/dev.toml
            artifacts/network-*/evidence.json
            artifacts/network-*/summary.json
            artifacts/network-*/manifest.json
            artifacts/network-*/replay.log
            artifacts/network-*/node.log
            artifacts/network-*/peer.log
            artifacts/network-*/node/ckb.toml
            artifacts/network-*/node/specs/dev.toml
            artifacts/network-*/peer/ckb.toml
            artifacts/network-*/peer/specs/dev.toml
            artifacts/network-*/execution-genesis.json
            artifacts/admission-*/evidence.json
            artifacts/admission-*/summary.json
            artifacts/admission-*/fee-check.json
            artifacts/admission-*/manifest.json
            artifacts/admission-*/replay.log
            artifacts/admission-*/node.log
            artifacts/admission-*/node/ckb.toml
            artifacts/admission-*/node/specs/dev.toml
            artifacts/a123-*/evidence.json
            artifacts/a123-*/summary.json
            artifacts/a123-*/manifest.json
            artifacts/a123-*/replay.log
            artifacts/a123-*/node.log
            artifacts/a123-*/node/ckb.toml
            artifacts/a123-*/node/specs/dev.toml
            artifacts/batch-*/evidence.json
            artifacts/batch-*/summary.json
            artifacts/batch-*/manifest.json
            artifacts/batch-*/replay.log
            artifacts/batch-*/node.log
            artifacts/batch-*/node/ckb.toml
            artifacts/batch-*/node/specs/dev.toml
            artifacts/evm-*/evidence.json
            artifacts/evm-*/summary.json
            artifacts/evm-*/manifest.json
            artifacts/evm-*/execution-genesis.json
            artifacts/evm-*/observer/current.json
            artifacts/evm-*/fresh-observer/current.json
            artifacts/evm-*/replay.log
            artifacts/evm-*/node.log
            artifacts/evm-*/node/ckb.toml
            artifacts/evm-*/node/specs/dev.toml
            artifacts/priority-*/evidence.json
            artifacts/priority-*/summary.json
            artifacts/priority-*/manifest.json
            artifacts/priority-*/replay.log
            artifacts/priority-*/node.log
            artifacts/priority-*/node/ckb.toml
            artifacts/priority-*/node/specs/dev.toml
            artifacts/sealed-*/evidence.json
            artifacts/sealed-*/summary.json
            artifacts/sealed-*/manifest.json
            artifacts/sealed-*/replay.log
            artifacts/sealed-*/node.log
            artifacts/sealed-*/node/ckb.toml
            artifacts/sealed-*/node/specs/dev.toml
