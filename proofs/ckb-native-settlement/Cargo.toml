[package]
name = "tactus-o1-native-settlement-script"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
[workspace]
[patch.crates-io]
lazy_static = { path = "../vendor/lazy_static-1.5.1" }
sp1-verifier = { path = "../vendor/sp1-verifier-6.8.1" }
substrate-bn-succinct-rs = { path = "../vendor/substrate-bn-succinct-rs-0.6.0" }
[target.'cfg(target_arch = "riscv64")'.dependencies]
lazy_static = { version = "=1.5.1", features = ["ckb_single_thread"] }
[dependencies]
sp1-verifier = { version = "=6.8.1", default-features = false }
ckb-std = { version = "=0.15.3", default-features = false, features = ["ckb-types", "allocator"] }
tactus-o1-native-anchor-script = { path = "../ckb-native-anchor", default-features = false }
tactus-o1-protocol = { path = "../../crates/tactus-o1-protocol", features = ["native-bridge"] }
[features]
default = ["entry"]
entry = []
[lib]
crate-type = ["rlib"]
[profile.release]
debug = false
panic = "abort"
lto = true
codegen-units = 1
[dev-dependencies]
serde_json = "=1.0.151"
