[package]
name = "tactus-o1-native-proof-host"
version = "0.1.0"
edition = "2021"
[features]
native-gnark = ["sp1-sdk/native-gnark", "dep:sp1-recursion-gnark-ffi"]
[dependencies]
sp1-sdk = { version = "=6.8.1", default-features = false }
tactus-o1-native-proof-journal = { path = "../native-sp1/journal" }
serde_json = "1"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sp1-recursion-gnark-ffi = { version = "=6.8.1", features = ["native"], optional = true }
sp1-verifier = { version = "=6.8.1", default-features = false }
num-bigint = "0.4"

[workspace]
[profile.release]
debug = 0
