[package]
name = "tactus-v02-sp1-host"
version = "0.2.0"
edition = "2021"
[dependencies]
sp1-sdk = { version = "=6.8.1", default-features = false }
tactus-v02-proof-journal = { path = "../journal" }
serde_json = "1"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tactus-o1-protocol = { path = "../../../crates/tactus-o1-protocol", features = ["v02"] }
