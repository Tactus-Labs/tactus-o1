[package]
name = "tactus-o1-execution"
description = "Pinned serial Ethereum execution for Tactus O1 batch inputs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.92"

[dependencies]
tactus-o1-protocol = { path = "../tactus-o1-protocol" }
revm = { version = "=43.0.3", default-features = false, features = ["std", "portable"] }
alloy-consensus = { version = "=2.1.1", features = ["k256", "serde"] }
alloy-eips = "=2.1.1"
alloy-primitives = { version = "=1.6.0", features = ["serde", "k256"] }
alloy-trie = { version = "=0.9.8", features = ["ethereum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native execution keeps the C backend. The zkVM uses revm's k256 backend,
# whose curve operations are accelerated by the pinned SP1 patches.
[target.'cfg(not(target_os = "zkvm"))'.dependencies]
revm = { version = "=43.0.3", default-features = false, features = ["secp256k1"] }

[build-dependencies]
tactus-o1-protocol = { path = "../tactus-o1-protocol" }
serde_json = "1"

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }

[features]
native-bridge = ["tactus-o1-protocol/native-bridge"]

[[example]]
name = "native-bridge-vectors"
required-features = ["native-bridge"]
