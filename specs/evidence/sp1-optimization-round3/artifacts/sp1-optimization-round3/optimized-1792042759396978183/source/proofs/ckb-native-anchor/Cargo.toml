[package]
name = "tactus-o1-native-anchor-script"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
[workspace]
[dependencies]
ckb-std = { version = "=0.15.3", default-features = false, features = ["ckb-types", "allocator"] }
alloy-primitives = { version = "=1.6.0", default-features = false }
tactus-o1-protocol = { path = "../../crates/tactus-o1-protocol", features = ["native-bridge"] }
[build-dependencies]
serde_json = "=1.0.151"
blake2b-ref = "=0.3.1"
[features]
default = ["entry"]
entry = []
[dev-dependencies]
serde_json = "=1.0.151"
[lib]
crate-type = ["rlib"]
[profile.release]
debug = false
panic = "abort"
